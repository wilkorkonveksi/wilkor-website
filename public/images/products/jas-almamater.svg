    <!-- Flap Pockets -->
    <rect x="180" y="240" width="38" height="10" rx="2" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <rect x="262" y="240" width="38" height="10" rx="2" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <!-- Crest/Logo on Chest -->
