    <circle cx="205" cy="165" r="10" fill="#EA580C" opacity="0.9"/>
    <path d="M200 165 L205 160 L210 165 L205 170 Z" fill="#FFFFFF"/>
    <!-- Sleeve Rib Cuff -->
    <line x1="100" y1="130" x2="140" y2="165" stroke="#0C4A6E" stroke-width="5"/>
    <line x1="380" y1="130" x2="340" y2="165" stroke="#0C4A6E" stroke-width="5"/>
  </g>
  <!-- Badges -->
  <g transform="translate(420, 70)">
    <rect width="150" height="44" rx="8" fill="#1E293B" stroke="#334155"/>
