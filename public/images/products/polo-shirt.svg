      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="poloFabric" x1="200" y1="80" x2="400" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#poloGrad)"/>
  <path d="M0 50h600M0 100h600M0 150h600M0 200h600M0 250h600M0 300h600M0 350h600" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
