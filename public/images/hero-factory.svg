<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EA580C"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgH)"/>
  
  <!-- Subtle Industrial Grid -->
  <g opacity="0.15">
    <path d="M0 60h800M0 120h800M0 180h800M0 240h800M0 300h800M0 360h800M0 420h800M0 480h800M0 540h800" stroke="#38BDF8" stroke-width="1"/>
    <path d="M60 0v600M120 0v600M180 0v600M240 0v600M300 0v600M360 0v600M420 0v600M480 0v600M540 0v600M600 0v600M660 0v600M720 0v600" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Modern Garment Workshop Workspace Floor & Cutting Table -->
  <g transform="translate(100, 140)">
    <!-- Main Industrial Workstation Surface -->
    <path d="M40 320 L560 320 L600 420 L0 420 Z" fill="url(#steelGrad)" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="420" width="600" height="15" fill="#0B132B"/>
    
    <!-- Table Stand Legs -->
    <rect x="50" y="435" width="20" height="70" fill="#334155"/>
    <rect x="530" y="435" width="20" height="70" fill="#334155"/>
    <rect x="290" y="435" width="20" height="70" fill="#334155"/>
    
    <!-- Industrial Sewing Machine Unit 1 (Heavy Duty) -->
    <g transform="translate(80, 160)">
      <path d="M30 140 L190 140 L190 60 L140 20 L40 20 L20 60 L20 140 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
      <rect x="35" y="140" width="150" height="20" fill="#CBD5E1"/>
      <!-- Arm & Needle Head -->
      <path d="M40 20 L130 20 C140 20 140 50 130 60 L60 60 L60 110 L50 110 L50 60 L40 60 Z" fill="#94A3B8"/>
      <!-- Thread Spool & Guide -->
      <circle cx="160" cy="10" r="10" fill="#EA580C"/>
      <line x1="160" y1="10" x2="55" y2="50" stroke="#EA580C" stroke-width="2"/>
      <line x1="55" y1="50" x2="55" y2="120" stroke="#EA580C" stroke-width="2"/>
      <!-- Needle light beam -->
      <path d="M50 120 L35 150 L75 150 Z" fill="#FEF08A" opacity="0.3"/>
      <!-- Fabric Under Needle -->
      <path d="M10 145 L110 145 L100 155 L0 155 Z" fill="#0284C7"/>
    </g>

    <!-- Digital Embroidery / Computer Panel (High-Tech) -->
    <g transform="translate(350, 130)">
      <rect x="0" y="0" width="200" height="150" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <rect x="15" y="15" width="170" height="100" rx="8" fill="#1E293B"/>
      <!-- Screen Graphic (Stitch Vector) -->
      <path d="M30 65 L60 35 L90 85 L120 45 L150 75" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="65" r="4" fill="#EA580C"/>
      <circle cx="60" cy="35" r="4" fill="#EA580C"/>
      <circle cx="90" cy="85" r="4" fill="#EA580C"/>
      <circle cx="120" cy="45" r="4" fill="#EA580C"/>
      <circle cx="150" cy="75" r="4" fill="#EA580C"/>
      <!-- Digital readouts -->
      <rect x="25" y="125" width="40" height="12" rx="3" fill="#10B981"/>
      <rect x="75" y="125" width="50" height="12" rx="3" fill="#334155"/>
      <rect x="135" y="125" width="40" height="12" rx="3" fill="#EA580C"/>
    </g>
  </g>

  <!-- Floating Metric Pill 1 (Kapasitas Besar) -->
  <g transform="translate(80, 90)">
    <rect width="210" height="64" rx="12" fill="#0F172A" stroke="#EA580C" stroke-width="2" filter="url(#glow)" opacity="0.95"/>
    <circle cx="34" cy="32" r="16" fill="#EA580C"/>
    <!-- Stack icon -->
    <path d="M26 30 L34 25 L42 30 L34 35 Z M26 34 L34 39 L42 34 M26 38 L34 43 L42 38" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <text x="60" y="27" fill="#F8FAFC" font-family="system-ui" font-size="14" font-weight="bold">150.000+ Pcs</text>
    <text x="60" y="45" fill="#94A3B8" font-family="system-ui" font-size="11">Kapasitas Output Bulanan</text>
  </g>

  <!-- Floating Metric Pill 2 (QC Standar Garment) -->
  <g transform="translate(510, 80)">
    <rect width="210" height="64" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2" filter="url(#glow)" opacity="0.95"/>
    <circle cx="34" cy="32" r="16" fill="#10B981"/>
    <!-- Check shield -->
    <path d="M28 28 L34 25 L40 28 V34 C40 38 34 41 34 41 C34 41 28 38 28 34 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M31 33 L33 35 L37 31" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="60" y="27" fill="#F8FAFC" font-family="system-ui" font-size="14" font-weight="bold">QC Garment 3-Tahap</text>
    <text x="60" y="45" fill="#94A3B8" font-family="system-ui" font-size="11">Inspeksi Presisi Jahitan</text>
  </g>

  <!-- Floating Metric Pill 3 (On-Time Delivery) -->
  <g transform="translate(490, 480)">
    <rect width="230" height="64" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" opacity="0.95"/>
    <circle cx="34" cy="32" r="16" fill="#0284C7"/>
    <!-- Clock icon -->
    <circle cx="34" cy="32" r="8" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <path d="M34 28 v4 l3 2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="60" y="27" fill="#F8FAFC" font-family="system-ui" font-size="14" font-weight="bold">99.4% On-Time SLA</text>
    <text x="60" y="45" fill="#94A3B8" font-family="system-ui" font-size="11">Jaminan Pengiriman Tepat Waktu</text>
  </g>
</svg>
